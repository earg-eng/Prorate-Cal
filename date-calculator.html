<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;700&display=swap');

  :root {
    --heading-blue: #14487a;
    --card-bg: #e8e8e8;
    --card-border: #d0d0d0;
    --input-border: #4a4a4a;
    --link-blue: #0645ad;
    --green: #3a6b1f;
    --green-dark: #2f5719;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .wrap {
    width: 100%;
    max-width: 500px;
  }

  h1 {
    color: var(--heading-blue);
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 14px;
    border-bottom: 1px solid #cfcfcf;
    padding-bottom: 12px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 18px 20px 22px;
  }

  .start-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 18px;
  }

  .start-label {
    font-size: 14px;
    color: #1a1a1a;
    font-weight: 400;
    line-height: 1.3;
    padding-top: 6px;
    white-space: nowrap;
  }

  .start-fields {
    display: flex;
    gap: 6px;
    flex: 1;
  }

  select, input[type="text"], input[type="number"] {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    color: #1a1a1a;
    background: #ffffff;
    border: 1px solid var(--input-border);
    border-radius: 2px;
    padding: 6px 8px;
  }

  select#startMonth { width: 90px; }
  input#startDay { width: 46px; }
  input#startYear { width: 70px; }

  .cal-icon {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 1px solid #999;
    border-radius: 3px;
    background: linear-gradient(135deg, #7fb3d5 0%, #e74c3c 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 10px;
    cursor: default;
  }

  .diff-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .sign-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #ffffff;
    border: 1px solid var(--input-border);
    border-radius: 3px;
    padding: 8px 10px;
    font-size: 16px;
    font-weight: 700;
    color: #1a1a1a;
    cursor: pointer;
    user-select: none;
    align-self: center;
  }

  .sign-toggle .arrow { font-size: 10px; margin-left: 2px; }

  .diff-fields {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .diff-field {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .diff-field input {
    width: 100%;
    text-align: left;
  }

  .diff-field label {
    font-size: 14px;
    color: #1a1a1a;
    width: 60px;
    flex-shrink: 0;
  }

  .biz-days {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 18px 0;
    padding-left: 68px;
  }

  .biz-days input { width: 16px; height: 16px; }
  .biz-days label { font-size: 14px; color: #1a1a1a; }

  .calc-btn-row {
    display: flex;
    justify-content: center;
  }

  button.calculate {
    background: linear-gradient(to bottom, var(--green), var(--green-dark));
    border: 1px solid #244712;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: 700;
    padding: 10px 20px 10px 26px;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  button.calculate:hover { filter: brightness(1.08); }
  button.calculate:active { transform: translateY(1px); }

  .play-icon {
    width: 22px;
    height: 22px;
    background: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .play-icon svg { width: 10px; height: 10px; }

  .result {
    margin-top: 20px;
    background: #ffffff;
    border: 1px solid var(--card-border);
    border-left: 4px solid var(--green);
    padding: 14px 18px;
    display: none;
  }

  .result.show { display: block; animation: fadeIn 0.2s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result .result-date {
    font-size: 20px;
    font-weight: 700;
    color: var(--heading-blue);
  }

  .result .result-sub {
    font-size: 13px;
    color: #555;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Add to or Subtract from a Date</h1>

  <div class="card">
    <div class="start-row">
      <div class="start-label">Start<br>Date</div>
      <div class="start-fields">
        <select id="startMonth">
          <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
          <option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option>
          <option value="6">Jul</option><option value="7" selected>Aug</option><option value="8">Sep</option>
          <option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
        </select>
        <select id="startDay">
        </select>
        <input type="text" id="startYear" value="2026" maxlength="4">
      </div>
      <div class="cal-icon">📅</div>
    </div>

    <div class="diff-row">
      <div class="sign-toggle" id="signToggle" data-sign="1">
        <span id="signSymbol">+</span><span class="arrow">▾</span>
      </div>
      <div class="diff-fields">
        <div class="diff-field"><input type="number" id="years" value="0" min="0"><label>years</label></div>
        <div class="diff-field"><input type="number" id="months" value="0" min="0"><label>months</label></div>
        <div class="diff-field"><input type="number" id="weeks" value="0" min="0"><label>weeks</label></div>
        <div class="diff-field"><input type="number" id="days" value="0" min="0"><label>days</label></div>
      </div>
    </div>

    <div class="biz-days">
      <input type="checkbox" id="businessDays">
      <label for="businessDays">calculate in business days</label>
    </div>

    <div class="calc-btn-row">
      <button class="calculate" onclick="calculateDate()">
        Calculate
        <span class="play-icon">
          <svg viewBox="0 0 10 10"><polygon points="0,0 10,5 0,10" fill="#3a6b1f"/></svg>
        </span>
      </button>
    </div>

    <div class="result" id="result">
      <div class="result-date" id="resultDate"></div>
      <div class="result-sub" id="resultSub"></div>
    </div>
  </div>
</div>

<script>
// populate day dropdown 1-31
const dayEl = document.getElementById('startDay');
for (let i = 1; i <= 31; i++) {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = i;
  if (i === 4) opt.selected = true;
  dayEl.appendChild(opt);
}

// sign toggle (+/-)
const signToggle = document.getElementById('signToggle');
const signSymbol = document.getElementById('signSymbol');
signToggle.addEventListener('click', () => {
  const current = signToggle.getAttribute('data-sign');
  const next = current === '1' ? '-1' : '1';
  signToggle.setAttribute('data-sign', next);
  signSymbol.textContent = next === '1' ? '+' : '\u2212';
});

function isWeekend(date) {
  const day = date.getDay();
  return day === 0 || day === 6;
}

function addBusinessDays(date, numDays, sign) {
  let result = new Date(date);
  let remaining = Math.abs(numDays);
  const step = sign >= 0 ? 1 : -1;
  while (remaining > 0) {
    result.setDate(result.getDate() + step);
    if (!isWeekend(result)) remaining--;
  }
  return result;
}

function calculateDate() {
  const month = parseInt(document.getElementById('startMonth').value, 10);
  const day = parseInt(document.getElementById('startDay').value, 10);
  const year = parseInt(document.getElementById('startYear').value, 10);

  const years = parseInt(document.getElementById('years').value, 10) || 0;
  const months = parseInt(document.getElementById('months').value, 10) || 0;
  const weeks = parseInt(document.getElementById('weeks').value, 10) || 0;
  const days = parseInt(document.getElementById('days').value, 10) || 0;

  const sign = parseInt(signToggle.getAttribute('data-sign'), 10);
  const businessDays = document.getElementById('businessDays').checked;

  let start = new Date(year, month, day);

  // years and months applied via calendar-aware setFullYear/setMonth
  start.setFullYear(start.getFullYear() + sign * years);
  start.setMonth(start.getMonth() + sign * months);

  const totalExtraDays = weeks * 7 + days;

  let result;
  if (businessDays && totalExtraDays > 0) {
    result = addBusinessDays(start, totalExtraDays, sign);
  } else {
    result = new Date(start);
    result.setDate(result.getDate() + sign * totalExtraDays);
  }

  const fmt = result.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  document.getElementById('resultDate').textContent = fmt;

  const parts = [];
  if (years) parts.push(years + ' year' + (years === 1 ? '' : 's'));
  if (months) parts.push(months + ' month' + (months === 1 ? '' : 's'));
  if (weeks) parts.push(weeks + ' week' + (weeks === 1 ? '' : 's'));
  if (days) parts.push(days + ' day' + (days === 1 ? '' : 's'));
  const verb = sign === 1 ? 'after' : 'before';
  const startFmt = start0Label(month, day, year);
  document.getElementById('resultSub').textContent =
    (parts.length ? parts.join(', ') : '0 days') + ' ' + verb + ' ' + startFmt +
    (businessDays ? ' (business days)' : '');

  document.getElementById('result').classList.add('show');
}

function start0Label(month, day, year) {
  const d = new Date(year, month, day);
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
</script>

</body>
</html>
