<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Calculator</title>
<style>
  :root{
    --green-dark:#3f6b21;
    --green:#4d7c2b;
    --green-light:#eaf3e3;
    --ink:#1f2a1c;
    --muted:#5c6b57;
    --line:#d8e2d1;
    --panel:#f6f8f4;
    --blue-line:#8fa8c9;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#ffffff;
    color:var(--ink);
    padding:20px;
  }
  .card{
    max-width:320px;
    margin:0 auto;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    background:#fff;
  }
  .result-bar{
    background:linear-gradient(180deg,var(--green) 0%,var(--green-dark) 100%);
    color:#fff;
    padding:10px 16px;
    font-weight:600;
    font-size:14px;
    letter-spacing:.2px;
  }
  .result-body{
    padding:18px 20px 20px;
    border-bottom:1px solid var(--line);
    background:#fff;
  }
  .result-date{
    font-size:20px;
    font-weight:700;
    color:var(--green-dark);
    margin:0 0 6px;
  }
  .result-sub{
    font-size:13px;
    color:var(--muted);
    margin:0;
  }
  .form{
    padding:20px;
    background:var(--panel);
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .field-block{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field-block .field-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  select, input[type="number"], input[type="text"]{
    width:100%;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--blue-line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  select:focus, input:focus{
    outline:2px solid var(--green);
    outline-offset:1px;
  }
  .op-toggle{
    display:flex;
    border:1px solid var(--blue-line);
    border-radius:6px;
    overflow:hidden;
    height:38px;
  }
  .op-toggle button{
    flex:1 1 50%;
    border:none;
    background:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    color:var(--muted);
  }
  .op-toggle button.active{
    background:var(--green);
    color:#fff;
  }
  .op-toggle button:first-child{ border-right:1px solid var(--blue-line); }
  .section-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:2px 0;
  }
  .biz-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink);
  }
  .biz-row input{ width:auto; }
  button.calc-btn{
    width:100%;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:11px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  button.calc-btn:hover{ background:var(--green-dark); }
  button.calc-btn svg{ width:14px; height:14px; }
</style>
</head>
<body>

<div class="card">
  <div class="result-bar">Result</div>
  <div class="result-body">
    <p class="result-date" id="resultDate">—</p>
    <p class="result-sub" id="resultSub">Enter a start date and an amount of time, then press Calculate.</p>
  </div>

  <div class="form">
    <div class="field-block">
      <label class="field-label" for="month">Month</label>
      <select id="month" aria-label="Month"></select>
    </div>
    <div class="field-block">
      <label class="field-label" for="day">Day</label>
      <select id="day" aria-label="Day"></select>
    </div>
    <div class="field-block">
      <label class="field-label" for="year">Year</label>
      <input type="text" id="year" aria-label="Year" maxlength="4" inputmode="numeric">
    </div>

    <hr class="section-divider">

    <div class="field-block">
      <span class="field-label">Adjust by</span>
      <div class="op-toggle" role="group" aria-label="Add or subtract">
        <button type="button" id="opAdd" class="active">+ Add</button>
        <button type="button" id="opSub">− Subtract</button>
      </div>
    </div>

    <div class="field-block">
      <label class="field-label" for="years">Years</label>
      <input type="number" id="years" min="0" value="0">
    </div>
    <div class="field-block">
      <label class="field-label" for="months">Months</label>
      <input type="number" id="months" min="0" value="0">
    </div>
    <div class="field-block">
      <label class="field-label" for="weeks">Weeks</label>
      <input type="number" id="weeks" min="0" value="0">
    </div>
    <div class="field-block">
      <label class="field-label" for="days">Days</label>
      <input type="number" id="days" min="0" value="0">
    </div>

    <hr class="section-divider">

    <label class="biz-row">
      <input type="checkbox" id="bizDays">
      calculate weeks/days in business days only
    </label>

    <button type="button" class="calc-btn" id="calcBtn">
      Calculate
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  var monthSel = document.getElementById('month');
  var daySel = document.getElementById('day');
  var yearInput = document.getElementById('year');
  var opAdd = document.getElementById('opAdd');
  var opSub = document.getElementById('opSub');
  var yearsInput = document.getElementById('years');
  var monthsInput = document.getElementById('months');
  var weeksInput = document.getElementById('weeks');
  var daysInput = document.getElementById('days');
  var bizDays = document.getElementById('bizDays');
  var resultDate = document.getElementById('resultDate');
  var resultSub = document.getElementById('resultSub');

  var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var mode = 'add';

  function daysInMonth(month, year){
    return new Date(year, month + 1, 0).getDate();
  }

  function populateMonths(){
    monthSel.innerHTML = '';
    MONTH_NAMES.forEach(function(name, idx){
      var opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = name;
      monthSel.appendChild(opt);
    });
  }

  function populateDays(){
    var month = parseInt(monthSel.value, 10);
    var year = parseInt(yearInput.value, 10) || new Date().getFullYear();
    var count = daysInMonth(month, year);
    var current = parseInt(daySel.value, 10) || 1;
    daySel.innerHTML = '';
    for (var d = 1; d <= count; d++){
      var opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      daySel.appendChild(opt);
    }
    daySel.value = Math.min(current, count);
  }

  function initToday(){
    var today = new Date();
    monthSel.value = today.getMonth();
    yearInput.value = today.getFullYear();
    populateDays();
    daySel.value = today.getDate();
  }

  function setMode(next){
    mode = next;
    opAdd.classList.toggle('active', mode === 'add');
    opSub.classList.toggle('active', mode === 'sub');
  }

  function addBusinessDays(date, totalDays){
    var result = new Date(date.getTime());
    var direction = totalDays < 0 ? -1 : 1;
    var remaining = Math.abs(totalDays);
    while (remaining > 0){
      result.setDate(result.getDate() + direction);
      var dow = result.getDay();
      if (dow !== 0 && dow !== 6){
        remaining--;
      }
    }
    return result;
  }

  function ordinalSuffix(n){
    var v = n % 100;
    if (v >= 11 && v <= 13) return 'th';
    switch (n % 10){
      case 1: return 'st';
      case 2: return 'nd';
      case 3: return 'rd';
      default: return 'th';
    }
  }

  function formatLong(date){
    var full = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return full[date.getMonth()] + ' ' + date.getDate() + ordinalSuffix(date.getDate()) + ', ' + date.getFullYear() + ', ' + WEEKDAY_NAMES[date.getDay()];
  }

  function calculate(){
    var month = parseInt(monthSel.value, 10);
    var day = parseInt(daySel.value, 10);
    var year = parseInt(yearInput.value, 10);

    if (!year || isNaN(month) || isNaN(day)){
      resultDate.textContent = '—';
      resultSub.textContent = 'Please enter a valid start date.';
      return;
    }

    var start = new Date(year, month, day);
    var sign = mode === 'sub' ? -1 : 1;

    var yrs = (parseInt(yearsInput.value, 10) || 0) * sign;
    var mos = (parseInt(monthsInput.value, 10) || 0) * sign;
    var wks = (parseInt(weeksInput.value, 10) || 0) * sign;
    var dys = (parseInt(daysInput.value, 10) || 0) * sign;

    var result = new Date(start.getTime());
    result.setFullYear(result.getFullYear() + yrs);
    result.setMonth(result.getMonth() + mos);

    var totalDays = (wks * 7) + dys;
    if (bizDays.checked){
      result = addBusinessDays(result, totalDays);
    } else {
      result.setDate(result.getDate() + totalDays);
    }

    resultDate.textContent = formatLong(result);

    var parts = [];
    if (Math.abs(yrs)) parts.push(Math.abs(yrs) + (Math.abs(yrs) === 1 ? ' year' : ' years'));
    if (Math.abs(mos)) parts.push(Math.abs(mos) + (Math.abs(mos) === 1 ? ' month' : ' months'));
    if (Math.abs(wks)) parts.push(Math.abs(wks) + (Math.abs(wks) === 1 ? ' week' : ' weeks'));
    if (Math.abs(dys)) parts.push(Math.abs(dys) + (Math.abs(dys) === 1 ? ' day' : ' days'));
    var amountText = parts.length ? parts.join(', ') : '0 days';
    var directionText = mode === 'sub' ? 'before' : 'after';
    var bizText = bizDays.checked ? ' (business days)' : '';

    resultSub.textContent = 'is the date ' + amountText + ' ' + directionText + ' ' +
      MONTH_NAMES[start.getMonth()] + ' ' + start.getDate() + ', ' + start.getFullYear() + bizText;
  }

  monthSel.addEventListener('change', populateDays);
  yearInput.addEventListener('input', populateDays);
  opAdd.addEventListener('click', function(){ setMode('add'); });
  opSub.addEventListener('click', function(){ setMode('sub'); });
  document.getElementById('calcBtn').addEventListener('click', calculate);

  populateMonths();
  initToday();
  setMode('add');
  calculate();
})();
</script>

</body>
</html>
